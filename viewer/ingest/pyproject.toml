[project]
name = "coralmind-viewer"
version = "0.1.0"
description = "Ingest for the CoralMind results viewer: reads results into the Next app's page data"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["corallab", "coralmap>=0.1.0", "pyyaml"]

[project.scripts]
coralmind-viewer = "coralmind_viewer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coralmind_viewer"]
